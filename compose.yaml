services:
  redis:
    image: redis:8.10.1-alpine
    profiles: ['redis']
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - myanlex-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.31.1
    profiles: ['auth']
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: myanlex
      POSTGRES_PASSWORD: myanlex
      POSTGRES_USER: myanlex
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myanlex -d myanlex']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - myanlex-postgres:/var/lib/postgresql

volumes:
  myanlex-redis:
  myanlex-postgres:
