name: myanlex-staging

x-runtime: &runtime
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  api:
    <<: *runtime
    image: myanlex-api:${MYANLEX_IMAGE_TAG:?Set an immutable candidate tag}
    build:
      context: .
      target: api
    env_file:
      ${MYANLEX_STAGING_ENV_FILE:?Set an absolute private API env file path}
    environment:
      NODE_ENV: production
      PORT: 3001
    ports: ['127.0.0.1:3101:3001']
    read_only: true
    tmpfs: ['/tmp']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/v1/health/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  web:
    <<: *runtime
    image: myanlex-web:${MYANLEX_IMAGE_TAG:?Set an immutable candidate tag}
    build:
      context: .
      target: web
      args:
        API_INTERNAL_URL: http://api:3001
        NEXT_PUBLIC_DOCS_URL: ${MYANLEX_DOCS_ORIGIN:?Set public docs origin}
        NEXT_PUBLIC_API_DOCS_URL:
          ${MYANLEX_API_ORIGIN:?Set public API origin}/docs
    environment:
      API_INTERNAL_URL: http://api:3001
    ports: ['127.0.0.1:3100:3000']
    depends_on:
      api:
        condition: service_healthy
  docs:
    <<: *runtime
    image: myanlex-docs:${MYANLEX_IMAGE_TAG:?Set an immutable candidate tag}
    build:
      context: .
      target: docs
      args:
        NEXT_PUBLIC_CONSOLE_URL:
          ${MYANLEX_CONSOLE_ORIGIN:?Set public console origin}
    ports: ['127.0.0.1:3102:3002']
  migrate:
    profiles: [operations]
    image: myanlex-migrate:${MYANLEX_IMAGE_TAG:?Set an immutable candidate tag}
    build:
      context: .
      target: migrate
    env_file:
      ${MYANLEX_STAGING_ENV_FILE:?Set an absolute private API env file path}
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
