    post:
      operationId: createApiKey
      summary: Create a scoped project key (api_key.create)
      tags: [Platform]
      security:
        - accountSession: []
      description: |
        Verified session required. Membership and current dynamic permissions
        are checked on every request. Writes require the configured trusted Origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
