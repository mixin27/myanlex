      required: [kind, input, output, start, end]
      properties:
        kind:
          type: string
          enum: [transliterated, preserved, unsupported]
        input:
          type: string
        output:
          type: string
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    TransliterationResult:
      type: object
      additionalProperties: false
      required: [input, output, scheme, profile, complete, segments]
      properties:
        input:
          type: string
        output:
          type: string
        scheme:
          type: string
          enum: [ala-lc-2011]
        profile:
          type: string
          const: ala-lc-2011-mapping-v1
        complete:
          type: boolean
        segments:
          type: array
          items:
            $ref: '#/components/schemas/TransliterationSegment'
    TextToken:
      type: object
      additionalProperties: false
      required: [kind, text, script, start, end]
      properties:
        kind:
          type: string
          enum:
            - burmese_syllable
            - latin_word
            - number
            - punctuation
            - whitespace
            - emoji
            - unsupported_myanmar
            - other
        text:
          type: string
        script:
          type: string
          enum: [myanmar, latin, common, unknown]
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    TokenizationResult:
      type: object
      additionalProperties: false
      required: [input, profile, tokens, scripts, mixedScript]
      properties:
        input:
          type: string
        profile:
          type: string
          const: myanmar-script-tokens-v1
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TextToken'
        scripts:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            type: string
            enum: [myanmar, latin]
        mixedScript:
          type: boolean
    BatchItem:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        text:
          type: string
          maxLength: 100000
          description: Well-formed Unicode text, limited by Unicode code points.
    BatchSyllabifyRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/BatchItem'
          description: Combined item text is limited to 1,000,000 UTF-8 bytes.
    BatchTransliterateRequest:
      type: object
      additionalProperties: false
      required: [items, scheme]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/BatchItem'
          description: Combined item text is limited to 1,000,000 UTF-8 bytes.
        scheme:
          type: string
          enum: [ala-lc-2011]
    BatchItemError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_unicode, text_too_long]
        message:
          type: string
    BatchItemFailure:
      type: object
      additionalProperties: false
      required: [id, success, error]
      properties:
        id:
          type: string
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/BatchItemError'
    BatchSyllabifySuccess:
      type: object
      additionalProperties: false
      required: [id, success, result]
      properties:
        id:
          type: string
        success:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/SyllabificationResult'
    BatchTransliterateSuccess:
      type: object
      additionalProperties: false
      required: [id, success, result]
      properties:
        id:
          type: string
        success:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/TransliterationResult'
    BatchSyllabifyResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/BatchSyllabifySuccess'
              - $ref: '#/components/schemas/BatchItemFailure'
    BatchTransliterateResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/BatchTransliterateSuccess'
              - $ref: '#/components/schemas/BatchItemFailure'
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            - invalid_request
            - invalid_unicode
            - encoding_mixed
            - encoding_mismatch
            - encoding_uncertain
            - text_too_long
            - batch_empty
            - batch_too_large
            - batch_too_many_items
            - payload_too_large
            - unauthorized
            - forbidden
            - not_found
            - rate_limited
            - quota_exceeded
            - service_unavailable
            - conflict
            - internal_error
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
