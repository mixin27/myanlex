openapi: 3.2.1
info:
  title: MyanLex API
  version: 0.1.0
  summary: Deterministic Myanmar-language text processing
  description: |
    MyanLex exposes the framework-independent language engine through a
    versioned JSON API. All text spans use zero-based, half-open Unicode
    code-point offsets, never UTF-8 bytes or JavaScript UTF-16 code units.

    Operations are explicit: detection never converts, conversion never
    auto-detects, and normalization uses only the documented safe NFC profile.

    Protected routes enforce short-window rate limits. Optional organization-wide
    UTC monthly quotas apply to persisted API keys before handler validation.
    A batch reserves one request and all submitted code points. Rejections use
    429 rate_limited or quota_exceeded with Retry-After; unavailable enforcement
    uses 503 service_unavailable. RateLimit headers describe short windows only.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.myanlex.dev/v1
    description: Production
  - url: /v1
    description: Same-origin development or self-hosting
security:
  - bearerApiKey: []
tags:
  - name: Platform
    description:
      Session-protected organization onboarding and project management
  - name: Health
    description: Service health
  - name: Text
    description: Encoding and normalization operations
  - name: Burmese
    description: Burmese-specific linguistic operations
  - name: Transliteration
    description: Explicit Myanmar-to-Latin schemes
  - name: Tokenization
    description: Lossless lexical and script boundaries
  - name: Batch
    description: Ordered multi-item text processing with isolated item failures
paths:
  /platform/organizations:
    get:
      operationId: listOrganizations
      summary: List organizations for the current member
      tags: [Platform]
      security:
        - accountSession: []
      description: |
        Requires a verified account session; API keys are not accepted.
        POST and PATCH require Origin to exactly match AUTH_PUBLIC_URL.
        Non-members receive 404; missing member permissions receive 403.
      parameters:
        - name: after
          in: query
          description:
            Exclusive UUID cursor returned as nextCursor by a prior page.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum results per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Successful operation. Responses are private and no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createOrganization
      summary: Create organization and initial membership
      tags: [Platform]
      security:
        - accountSession: []
      description: |
        Requires a verified account session; API keys are not accepted.
        POST and PATCH require Origin to exactly match AUTH_PUBLIC_URL.
        Non-members receive 404; missing member permissions receive 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Successful operation. Responses are private and no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
