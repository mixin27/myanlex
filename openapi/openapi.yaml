          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
  /batch/transliterate:
    post:
      operationId: batchTransliterate
      summary: Transliterate multiple Myanmar texts to Latin
      description: |
        Applies one explicit scheme to every item and preserves request order.
        Invalid Unicode or overlong text fails only the affected item.
      tags: [Batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTransliterateRequest'
      responses:
        '200':
          description: Ordered transliteration results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTransliterateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
components:
  securitySchemes:
    accountSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |
        Better Auth signed HttpOnly session cookie; HTTPS uses the
        __Secure-better-auth.session_token name. Sign in through /api/auth.
        Browser clients send cookies automatically; do not paste secrets into docs.
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: API-Key
      description: A MyanLex API key supplied as a bearer token.
  requestBodies:
    TextRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TextRequest'
  responses:
    TeamConflict:
      description: |-
        The change conflicts with team state: a duplicate slug or invitation, a
        system role, a role in use, or no remaining member manager.
      content:
        'application/problem+json':
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationGone:
      description:
        The invitation has expired, been revoked, or already been used.
      content:
        'application/problem+json':
          schema:
            $ref: '#/components/schemas/Problem'
    LedgerExpired:
      description:
        The month's ledger lines are past the retention period. Its statement
        remains available.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceNotFound:
      description: The resource does not exist or is not visible to this member.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BillingEmailConflict:
      description:
        The address is already a billing email, the workspace has three, the
        address is already confirmed, or a link was sent less than a minute ago.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PlanChangeConflict:
      description:
        The workspace already has an open plan change, or the change is no
        longer pending.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceConflict:
      description: The slug is already in use.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PlatformUnavailable:
      description:
        Account authentication, persistence, or limit enforcement is
        unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request body, parameters, or Unicode text is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description:
        The required API key or account session is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description:
        Required permissions, email verification, or a trusted Origin are
        missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description:
        Text, item count, batch text, or the HTTP body exceeds its documented
        limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: |
        The caller exceeded its short-window allowance (rate_limited), or the
        organization exhausted a monthly allowance (quota_exceeded, persisted API
        keys only). Retry-After describes the applicable reset. RateLimit headers
        always describe the short window, not monthly quotas.
      headers:
        RateLimit-Limit:
          description: Maximum requests allowed in the current window.
          schema:
            type: integer
            minimum: 1
        RateLimit-Remaining:
          description: Requests remaining in the current window.
          schema:
            type: integer
            minimum: 0
        RateLimit-Reset:
          description: Seconds until the current window resets.
          schema:
            type: integer
            minimum: 1
        Retry-After:
          description: Seconds until another request should be attempted.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: An unexpected service error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RoleReference:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    Role:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          slug,
          description,
          system,
          permissions,
          memberCount,
          invitationCount,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        system:
          type: boolean
          description: System roles hold the full catalog and cannot be changed.
        permissions:
          type: array
          items:
            type: string
        memberCount:
          type: integer
          minimum: 0
        invitationCount:
          type: integer
          minimum: 0
          description: Open invitations that use this role.
    RoleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    RoleInput:
      type: object
      additionalProperties: false
      required: [name, slug, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: The owner slug is reserved.
        description:
          type: [string, 'null']
          maxLength: 500
        permissions:
          type: array
          items:
            type: string
          description: Permission keys from listPermissions.
    RoleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description:
          type: [string, 'null']
          maxLength: 500
        permissions:
          type: array
          items:
            type: string
    Permission:
      type: object
      additionalProperties: false
      required: [key, description]
      properties:
        key:
          type: string
        description:
          type: string
    PermissionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    Member:
      type: object
      additionalProperties: false
      required: [userId, name, email, role, permissions, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/RoleReference'
        permissions:
          type: array
          items:
            type: string
        joinedAt:
          type: string
          format: date-time
    MemberPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        nextCursor:
          type: [string, 'null']
          format: uuid
    OwnershipTransferInput:
      type: object
      additionalProperties: false
      required: [toUserId, newRoleId, confirmSlug]
      properties:
        toUserId:
          type: string
          format: uuid
          description: Member who receives the Owner role.
        newRoleId:
          type: string
          format: uuid
          description: Non-system role the current Owner moves to.
        confirmSlug:
          type: string
          minLength: 1
          maxLength: 80
          description: Must equal the organization slug exactly.
    OwnershipTransfer:
      type: object
      additionalProperties: false
      required: [owner, previousOwner]
      properties:
        owner:
          $ref: '#/components/schemas/Member'
        previousOwner:
          $ref: '#/components/schemas/Member'
    AuditAction:
      type: string
      enum:
        - organization.created
        - project.created
        - project.updated
        - api_key.created
        - api_key.revoked
        - member.role_changed
        - member.removed
        - member.left
        - role.created
        - role.updated
        - role.deleted
        - invitation.created
        - invitation.resent
        - invitation.revoked
        - invitation.accepted
        - ownership.transferred
        - billing.plan_changed
        - billing.plan_change_requested
        - billing.plan_change_cancelled
        - billing.plan_change_applied
        - billing.plan_change_rejected
        - billing.invoice_issued
        - billing.invoice_paid
        - billing.invoice_voided
        - billing.suspended_for_nonpayment
        - billing.plan_restored
        - billing.profile_updated
        - billing.email_added
        - billing.email_confirmed
        - billing.email_removed
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, action, actor, target, metadata, requestId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/AuditAction'
        actor:
          type: object
          additionalProperties: false
          required: [userId, email]
          properties:
            userId:
              type: [string, 'null']
              format: uuid
              description: Null after the acting account is deleted.
            email:
              type: string
              description: Email address at the time of the change.
        target:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
              enum: [organization, project, api_key, member, role, invitation]
            id:
              type: string
        metadata:
          type: object
          description:
            Action-specific details such as role names or changed fields.
          additionalProperties: true
        requestId:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    UsageStatement:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          month,
          timezone,
          periodStart,
          periodEnd,
          status,
          billableUnit,
          generatedAt,
          closedAt,
          totals,
          counter,
          reconciled,
          plan,
          charges,
          lines,
          ledgerAvailable,
        ]
      properties:
        organizationId: { type: string, format: uuid }
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        timezone: { type: string, const: UTC }
        periodStart: { type: string, format: date-time }
        periodEnd:
          type: string
          format: date-time
          description: Exclusive end of the month.
        status:
          type: string
          enum: [open, closed]
        billableUnit: { type: string, const: admitted-request }
        generatedAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        totals:
          type: object
          additionalProperties: false
          required: [requests, characters, events]
          properties:
            requests: { $ref: '#/components/schemas/DecimalCount' }
            characters:
              $ref: '#/components/schemas/DecimalCount'
            events: { $ref: '#/components/schemas/DecimalCount' }
        counter:
          type: object
          additionalProperties: false
          description: The organization's quota counter for the same month.
          required: [requests, characters]
          properties:
            requests: { $ref: '#/components/schemas/DecimalCount' }
            characters:
              $ref: '#/components/schemas/DecimalCount'
        reconciled:
          type: boolean
          description: True when ledger totals equal the quota counter.
        plan:
          allOf:
            - $ref: '#/components/schemas/PlanTermsPartial'
          description: |
            Plan in effect at the end of the month, or now for the open month.
            Statements closed before plan pricing hold only name, slug and the
            two limits.
        charges:
          description: |
            Charges on that plan: an estimate (`estimated: true`) while the
            month is open, fixed once closed. Null for months closed before plan
            pricing existed.
          oneOf:
            - $ref: '#/components/schemas/Charges'
            - type: 'null'
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [projectId, projectName, source, apiKey, requests, characters]
            properties:
              projectId: { type: string, format: uuid }
              projectName: { type: string }
              source:
                type: string
                enum: [api_key, playground]
              apiKey:
                type: [object, 'null']
                additionalProperties: false
                required: [id, name, prefix]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: [string, 'null'] }
                  prefix: { type: [string, 'null'] }
              requests: { $ref: '#/components/schemas/DecimalCount' }
              characters:
                $ref: '#/components/schemas/DecimalCount'
        ledgerAvailable:
          type: boolean
          description: Whether the month's ledger lines can still be downloaded.
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          type: [string, 'null']
    MemberUpdate:
      type: object
      additionalProperties: false
      required: [roleId]
      properties:
        roleId:
          type: string
          format: uuid
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/RoleReference'
        status:
          type: string
          enum: [pending, expired, accepted, revoked]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    SentInvitation:
      type: object
      additionalProperties: false
      required: [id, email, role, status, expiresAt, createdAt, emailDelivery]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/RoleReference'
        status:
          type: string
          enum: [pending, expired, accepted, revoked]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        emailDelivery:
          type: string
          enum: [sent, failed, disabled]
          description:
            Best-effort email outcome. The invitation exists regardless.
    InvitationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        nextCursor:
          type: [string, 'null']
          format: uuid
    InvitationInput:
      type: object
      additionalProperties: false
      required: [email, roleId]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        roleId:
          type: string
          format: uuid
    PendingInvitation:
      type: object
      additionalProperties: false
      required: [id, organization, role, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organization:
          $ref: '#/components/schemas/Organization'
        role:
          $ref: '#/components/schemas/RoleReference'
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    PendingInvitationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingInvitation'
    InvitationAccept:
      oneOf:
        - type: object
          additionalProperties: false
          required: [token]
          properties:
            token:
              type: string
              minLength: 32
              maxLength: 128
              pattern: '^[A-Za-z0-9_-]+$'
        - type: object
          additionalProperties: false
          required: [invitationId]
          properties:
            invitationId:
              type: string
              format: uuid
    AcceptedInvitation:
      type: object
      additionalProperties: false
      required: [status, organization]
      properties:
        status:
          type: string
          enum: [accepted, already_member]
        organization:
          $ref: '#/components/schemas/Organization'
    DecimalCount:
      type: string
      description: Non-negative integer as a decimal string.
      pattern: '^(0|[1-9][0-9]*)$'
    QuotaDimension:
      type: object
      additionalProperties: false
      required: [used, limit, remaining, ceiling, overage]
      properties:
        used: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        limit:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)$'
          description:
            Monthly allowance included in the plan; null is unlimited.
        remaining: { type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$' }
        ceiling:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]*)$'
          description:
            Count at which admission stops when enforcement is on. The allowance
            on block plans; the overage ceiling (null for none) on allow plans.
        overage:
          $ref: '#/components/schemas/DecimalCount'
          description: Usage above the allowance.
    PlanChange:
      type: object
      additionalProperties: false
      description: |
        A requested plan change. The approval channel waits in `pending` for an
        operator; the checkout channel (reserved) will wait in
        `awaiting_payment`. At most one change is open per workspace.
      required:
        [
          id,
          channel,
          status,
          fromPlanSlug,
          plan,
          timing,
          requestedStartsAt,
          note,
          requesterEmail,
          createdAt,
          decidedAt,
          decisionNote,
        ]
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, enum: [approval, checkout] }
        status:
          type: string
          enum:
            [pending, awaiting_payment, applied, rejected, cancelled, expired]
        fromPlanSlug: { type: string }
        plan:
          type: object
          additionalProperties: false
          required: [name, slug]
          properties:
            name: { type: string }
            slug: { type: string }
        timing:
          type: string
          enum: [now, next_month]
          description:
            now applies on approval; next_month on the 1st of the month after
            the request (UTC), or on approval if that date has passed.
        requestedStartsAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
        requesterEmail: { type: string, format: email }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'] }
    ChangePreview:
      type: object
      additionalProperties: false
      description: |
        How moving to a plan is billed (ADR 0026). Only upgrades may start
        now, invoiced for the rest of the month; downgrades, moves to Free and
        currency changes start on the 1st of next month.
      required: [kind, nowAllowed, prorationMinor, currency]
      properties:
        kind: { type: string, enum: [upgrade, downgrade, currency] }
        nowAllowed: { type: boolean }
        prorationMinor:
          description: Invoiced for the rest of the month if it started now.
          oneOf:
            - $ref: '#/components/schemas/MinorAmount'
            - type: 'null'
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    BillingDetailsInput:
      type: object
      additionalProperties: false
      required: [legalName, address, taxId, invoiceNote]
      properties:
        legalName: { type: [string, 'null'], maxLength: 200 }
        address:
          type: [string, 'null']
          maxLength: 500
          description: May contain line breaks.
        taxId: { type: [string, 'null'], maxLength: 64 }
        invoiceNote:
          type: [string, 'null']
          maxLength: 500
          description: A purchase order number or reference for every invoice.
    BillingEmail:
      type: object
      additionalProperties: false
      required: [id, email, status, sentAt, confirmedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [confirmed, pending, expired] }
        sentAt:
          type: string
          format: date-time
          description: When the address was added or its link last sent.
        confirmedAt: { type: [string, 'null'], format: date-time }
    BillingEmailDelivery:
      allOf:
        - $ref: '#/components/schemas/BillingEmail'
      type: object
      required: [delivery]
      properties:
        delivery: { type: string, enum: [sent, failed, disabled] }
    BillingProfile:
      allOf:
        - $ref: '#/components/schemas/BillingDetailsInput'
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/BillingEmail' }
    UsageAlert:
      type: object
      additionalProperties: false
      required: [kind, dimension, used, limit, createdAt]
      properties:
        kind:
          type: string
          enum: [allowance_80, allowance_100, ceiling_90]
          description:
            80% or 100% of the monthly allowance, or 90% of an overage plan's
            ceiling.
        dimension: { type: string, enum: [requests, characters] }
        used:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          description: Requests or characters used when the alert was recorded.
        limit:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: The allowance or ceiling the percentage refers to.
        createdAt: { type: string, format: date-time }
    BillTo:
      type: object
      additionalProperties: false
      description: The bill-to details as they were when the invoice was issued.
      required: [name, address, taxId, note]
      properties:
        name: { type: string }
        address: { type: [string, 'null'] }
        taxId: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
    Invoice:
      type: object
      additionalProperties: false
      description: |
        A MyanLex invoice. Monthly invoices bill the month's base fee in
        advance and the previous month's overage in arrears; proration
        invoices bill an upgrade for the rest of its month. Due seven days
        after issue. Amounts are minor units.
      required:
        [
          number,
          billTo,
          kind,
          status,
          periodStart,
          periodEnd,
          currency,
          subtotalMinor,
          totalMinor,
          issuedAt,
          dueAt,
          paidAt,
          voidedAt,
          voidReason,
          overdue,
          suspended,
          lines,
          payments,
        ]
      properties:
        number: { type: string, pattern: '^MLX-[0-9]{4}-[0-9]{6}$' }
        billTo:
          description: Null on invoices issued before billing details existed.
          oneOf:
            - $ref: '#/components/schemas/BillTo'
            - type: 'null'
        kind: { type: string, enum: [monthly, proration] }
        status: { type: string, enum: [open, paid, void] }
        periodStart: { type: string, format: date-time }
        periodEnd:
          type: string
          format: date-time
          description: Exclusive end of the period.
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotalMinor: { $ref: '#/components/schemas/MinorAmount' }
        totalMinor: { $ref: '#/components/schemas/MinorAmount' }
        issuedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
        voidedAt: { type: [string, 'null'], format: date-time }
        voidReason: { type: [string, 'null'] }
        overdue: { type: boolean }
        suspended:
          type: boolean
          description: Whether this overdue invoice moved the workspace to Free.
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, description, quantity, unitMinor, amountMinor]
            properties:
              kind:
                type: string
                enum: [base_fee, proration, request_overage, character_overage]
              description: { type: string }
              quantity: { $ref: '#/components/schemas/DecimalCount' }
              unitMinor: { $ref: '#/components/schemas/MinorAmount' }
              amountMinor: { $ref: '#/components/schemas/MinorAmount' }
        payments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [method, provider, amountMinor, receivedAt]
            properties:
              method: { type: string, enum: [bank_transfer, cash, provider] }
              provider: { type: [string, 'null'] }
              amountMinor: { $ref: '#/components/schemas/MinorAmount' }
              receivedAt: { type: string, format: date-time }
    PlanChangeInput:
      type: object
      additionalProperties: false
      required: [planSlug, timing]
      properties:
        planSlug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,79}$'
          description: A public plan other than the current one, or free.
        timing: { type: string, enum: [now, next_month] }
        note: { type: string, maxLength: 500 }
    MinorAmount:
      type: string
      description:
        Non-negative integer amount in the currency's minor units, as a decimal
        string, using the currency's standard digits (MMK 0, USD 2).
      pattern: '^(0|[1-9][0-9]*)$'
    PlanTerms:
      type: object
      description: Plan terms. Responses may add fields such as source.
      required:
        [
          name,
          slug,
          monthlyRequestLimit,
          monthlyCharacterLimit,
          currency,
          baseFeeMinor,
          overageMode,
          requestBlock,
          requestBlockPriceMinor,
          characterBlock,
          characterBlockPriceMinor,
          requestCeiling,
          characterCeiling,
        ]
      properties:
        name: { type: string }
        slug: { type: string }
        monthlyRequestLimit:
          type: [string, 'null']
          description: Requests included each month; null is unlimited.
        monthlyCharacterLimit:
          type: [string, 'null']
          description: Characters included each month; null is unlimited.
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        baseFeeMinor: { $ref: '#/components/schemas/MinorAmount' }
        overageMode:
          type: string
          enum: [block, allow]
          description:
            block refuses requests at the allowance; allow bills usage above it
            per started block, up to the ceilings.
        requestBlock: { $ref: '#/components/schemas/DecimalCount' }
        requestBlockPriceMinor: { $ref: '#/components/schemas/MinorAmount' }
        characterBlock: { $ref: '#/components/schemas/DecimalCount' }
        characterBlockPriceMinor: { $ref: '#/components/schemas/MinorAmount' }
        requestCeiling: { type: [string, 'null'] }
        characterCeiling: { type: [string, 'null'] }
    PlanTermsPartial:
      type: object
      additionalProperties: false
      required: [name, slug, monthlyRequestLimit, monthlyCharacterLimit]
      properties:
        name: { type: string }
        slug: { type: string }
        monthlyRequestLimit:
          type: [string, 'null']
          description: Requests included each month; null is unlimited.
        monthlyCharacterLimit:
          type: [string, 'null']
          description: Characters included each month; null is unlimited.
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        baseFeeMinor: { $ref: '#/components/schemas/MinorAmount' }
        overageMode:
          type: string
          enum: [block, allow]
          description:
            block refuses requests at the allowance; allow bills usage above it
            per started block, up to the ceilings.
        requestBlock: { $ref: '#/components/schemas/DecimalCount' }
        requestBlockPriceMinor: { $ref: '#/components/schemas/MinorAmount' }
        characterBlock: { $ref: '#/components/schemas/DecimalCount' }
        characterBlockPriceMinor: { $ref: '#/components/schemas/MinorAmount' }
        requestCeiling: { type: [string, 'null'] }
        characterCeiling: { type: [string, 'null'] }
    OverageLine:
      type: object
      additionalProperties: false
      required: [units, blocks, blockSize, blockPriceMinor, amountMinor]
      properties:
        units:
          $ref: '#/components/schemas/DecimalCount'
          description: Usage above the allowance.
        blocks:
          $ref: '#/components/schemas/DecimalCount'
          description: Started blocks charged, ceil(units / blockSize).
        blockSize: { $ref: '#/components/schemas/DecimalCount' }
        blockPriceMinor: { $ref: '#/components/schemas/MinorAmount' }
        amountMinor: { $ref: '#/components/schemas/MinorAmount' }
    Charges:
      type: object
      additionalProperties: false
      required:
        [currency, baseFeeMinor, requests, characters, totalMinor, estimated]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        baseFeeMinor: { $ref: '#/components/schemas/MinorAmount' }
        requests: { $ref: '#/components/schemas/OverageLine' }
        characters: { $ref: '#/components/schemas/OverageLine' }
        totalMinor: { $ref: '#/components/schemas/MinorAmount' }
        estimated:
          type: boolean
          description: True while the month is open and may still change.
    BillingOverview:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          generatedAt,
          plan,
          currentMonth,
          subscriptions,
          publicPlans,
          changes,
          openChange,
          canRequestChange,
          freeChange,
          outstanding,
          suspended,
          paymentInstructions,
          profile,
          usageAlerts,
        ]
      properties:
        organizationId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        plan:
          allOf:
            - $ref: '#/components/schemas/PlanTerms'
          type: object
          required: [source, description]
          properties:
            source: { type: string, enum: [subscription, free] }
            description: { type: [string, 'null'] }
        currentMonth:
          type: object
          additionalProperties: false
          required: [month, timezone, totals, charges]
          properties:
            month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
            timezone: { type: string, const: UTC }
            totals:
              type: object
              additionalProperties: false
              required: [requests, characters]
              properties:
                requests: { $ref: '#/components/schemas/DecimalCount' }
                characters: { $ref: '#/components/schemas/DecimalCount' }
            charges: { $ref: '#/components/schemas/Charges' }
        subscriptions:
          type: array
          description:
            Plan periods, newest first. Gaps mean the Free plan applied.
          items:
            type: object
            additionalProperties: false
            required: [id, plan, startsAt, endsAt, status, note]
            properties:
              id: { type: string, format: uuid }
              plan:
                type: object
                additionalProperties: false
                required: [name, slug]
                properties:
                  name: { type: string }
                  slug: { type: string }
              startsAt: { type: string, format: date-time }
              endsAt: { type: [string, 'null'], format: date-time }
              status:
                type: string
                enum: [current, scheduled, ended]
              note: { type: [string, 'null'] }
        publicPlans:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/PlanTerms'
            type: object
            required: [description, changePolicy, change]
            properties:
              description: { type: [string, 'null'] }
              change: { $ref: '#/components/schemas/ChangePreview' }
              changePolicy:
                type: string
                enum: [approval, self_service]
                description:
                  How the plan is changed to. self_service (checkout) needs a
                  payment provider; until then every plan uses approval.
        changes:
          type: array
          description: Latest plan changes, newest first (at most 10).
          items: { $ref: '#/components/schemas/PlanChange' }
        openChange:
          description: The workspace's open change, if any.
          oneOf:
            - $ref: '#/components/schemas/PlanChange'
            - type: 'null'
        canRequestChange:
          type: boolean
          description: Whether the caller holds billing.manage.
        profile: { $ref: '#/components/schemas/BillingProfile' }
        usageAlerts:
          type: array
          description:
            Usage thresholds crossed this month, oldest first. Each is emailed
            once to the billing contacts.
          items: { $ref: '#/components/schemas/UsageAlert' }
        freeChange: { $ref: '#/components/schemas/ChangePreview' }
        outstanding:
          type: array
          description: Open invoices per currency.
          items:
            type: object
            additionalProperties: false
            required: [currency, totalMinor, invoices, oldestDueAt, overdue]
            properties:
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              totalMinor: { $ref: '#/components/schemas/MinorAmount' }
              invoices: { type: integer, minimum: 1 }
              oldestDueAt: { type: string, format: date-time }
              overdue: { type: boolean }
        suspended:
          description:
            Set when an overdue invoice moved the workspace to Free; paying it
            restores `plan`.
          oneOf:
            - type: object
              additionalProperties: false
              required: [invoiceNumber, plan]
              properties:
                invoiceNumber: { type: string }
                plan: { type: string }
            - type: 'null'
        paymentInstructions:
          type: [string, 'null']
          description:
            How to pay invoices (MYANLEX_BILLING_PAYMENT_INSTRUCTIONS).
    QuotaReport:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          enforcementEnabled,
          timezone,
          generatedAt,
          periodStart,
          resetsAt,
          metering,
          plan,
          requests,
          characters,
        ]
      properties:
        organizationId: { type: string, format: uuid }
        enforcementEnabled: { type: boolean }
        timezone: { type: string, const: UTC }
        generatedAt: { type: string, format: date-time }
        periodStart: { type: string, format: date-time }
        resetsAt: { type: string, format: date-time }
        metering: { type: string, const: admission-reservations }
        plan:
          type: object
          additionalProperties: false
          required: [name, slug, source, overageMode]
          properties:
            name: { type: string }
            slug: { type: string }
            source: { type: string, enum: [subscription, free] }
            overageMode: { type: string, enum: [block, allow] }
        requests:
          $ref: '#/components/schemas/QuotaDimension'
        characters:
          $ref: '#/components/schemas/QuotaDimension'
    OrganizationInput:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Whitespace-trimmed display name, including Unicode.
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    ProjectInput:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          $ref: '#/components/schemas/OrganizationInput/properties/name'
        slug:
          $ref: '#/components/schemas/OrganizationInput/properties/slug'
        environment:
          type: string
          enum: [development, staging, production]
          default: development
    ProjectUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/OrganizationInput/properties/name'
        slug:
          $ref: '#/components/schemas/OrganizationInput/properties/slug'
        environment:
          type: string
          enum: [development, staging, production]
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    OrganizationAccess:
      type: object
      additionalProperties: false
      required: [id, name, slug, permissions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        permissions:
          type: array
          items:
            type: string
    Project:
      type: object
      additionalProperties: false
      required: [id, organizationId, name, slug, environment]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        environment:
          type: string
    OrganizationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        nextCursor:
          type: [string, 'null']
          format: uuid
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        nextCursor:
          type: [string, 'null']
          format: uuid
    ApiKeyInput:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [api.invoke]
          description:
            Only machine capabilities held by the creating member may be
            delegated.
        expiresAt:
          type: string
          format: date-time
          description: Future UTC expiration. Omit for no expiration.
    ApiKey:
      type: object
      additionalProperties: false
      required:
        [
          id,
          projectId,
          name,
          prefix,
          scopes,
          createdAt,
          lastUsedAt,
          expiresAt,
          revokedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
    CreatedApiKey:
      type: object
      additionalProperties: false
      required:
        [
          id,
          projectId,
          name,
          prefix,
          scopes,
          createdAt,
          lastUsedAt,
          expiresAt,
          revokedAt,
          secret,
        ]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        secret:
          type: string
          description:
            Returned once at creation. Never returned by list or revoke.
    ApiKeyPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
        nextCursor:
          type: [string, 'null']
          format: uuid
    UsageMetrics:
      type: object
      additionalProperties: false
      required:
        [
          requestCount,
          errorCount,
          charactersProcessed,
          processingTimeMs,
          averageProcessingTimeMs,
        ]
      properties:
        requestCount:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        errorCount:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        charactersProcessed:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        processingTimeMs:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        averageProcessingTimeMs:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
          description:
            Weighted handler duration, rounded to two decimals; null when no
            requests are recorded.
    UsageDay:
      type: object
      additionalProperties: false
      required:
        [
          date,
          requestCount,
          errorCount,
          charactersProcessed,
          processingTimeMs,
          averageProcessingTimeMs,
        ]
      properties:
        date:
          type: string
          format: date
        requestCount:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        errorCount:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        charactersProcessed:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        processingTimeMs:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        averageProcessingTimeMs:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
          description:
            Weighted handler duration, rounded to two decimals; null when no
            requests are recorded.
    UsageReport:
      type: object
      additionalProperties: false
      required:
        [projectId, from, to, timezone, generatedAt, metering, totals, days]
      properties:
        projectId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timezone:
          type: string
          const: UTC
        generatedAt:
          type: string
          format: date-time
        metering:
          type: string
          const: best-effort
        sources:
          type: object
          additionalProperties: false
          required: [api_key, playground]
          properties:
            api_key: { $ref: '#/components/schemas/UsageMetrics' }
            playground: { $ref: '#/components/schemas/UsageMetrics' }
        totals:
          $ref: '#/components/schemas/UsageMetrics'
        days:
          type: array
          minItems: 1
          maxItems: 90
          items:
            $ref: '#/components/schemas/UsageDay'
    PlaygroundExecution:
      oneOf:
        - type: object
          additionalProperties: false
          required: [operation, payload]
          properties:
            operation: { type: string, const: detect }
            payload: { $ref: '#/components/schemas/TextRequest' }
        - type: object
          additionalProperties: false
          required: [operation, payload]
          properties:
            operation: { type: string, const: normalize }
            payload: { $ref: '#/components/schemas/TextRequest' }
        - type: object
          additionalProperties: false
          required: [operation, payload]
          properties:
            operation: { type: string, const: convert }
            payload: { $ref: '#/components/schemas/ConvertTextRequest' }
        - type: object
          additionalProperties: false
          required: [operation, payload]
          properties:
            operation: { type: string, const: syllabify }
            payload: { $ref: '#/components/schemas/TextRequest' }
        - type: object
          additionalProperties: false
          required: [operation, payload]
          properties:
            operation: { type: string, const: orthography }
            payload: { $ref: '#/components/schemas/TextRequest' }
        - type: object
          additionalProperties: false
          required: [operation, payload]
          properties:
            operation: { type: string, const: transliterate }
            payload: { $ref: '#/components/schemas/TransliterateTextRequest' }
        - type: object
          additionalProperties: false
          required: [operation, payload]
          properties:
            operation: { type: string, const: tokenize }
            payload: { $ref: '#/components/schemas/TextRequest' }
        - type: object
          additionalProperties: false
          required: [operation, payload]
          properties:
            operation: { type: string, const: batch_syllabify }
            payload: { $ref: '#/components/schemas/BatchSyllabifyRequest' }
        - type: object
          additionalProperties: false
          required: [operation, payload]
          properties:
            operation: { type: string, const: batch_transliterate }
            payload: { $ref: '#/components/schemas/BatchTransliterateRequest' }
    PlaygroundRun:
      type: object
      additionalProperties: false
      required: [request, mode, build, elapsedMs, profiles]
      description:
        Local runs have no HTTP metadata. Build identifies the source revision;
        development builds are explicit.
      oneOf:
        - required: [result]
          not: { required: [error], properties: { error: {} } }
        - required: [error]
          not: { required: [result], properties: { result: {} } }
      properties:
        request: { $ref: '#/components/schemas/PlaygroundExecution' }
        mode: { type: string, enum: [local, api] }
        build: { type: string, minLength: 1, maxLength: 120 }
        elapsedMs: { type: number, minimum: 0 }
        profiles:
          type: array
          maxItems: 1000
          items: { type: string, minLength: 1, maxLength: 120 }
        httpStatus: { type: integer, minimum: 100, maximum: 599 }
        requestId: { type: string, maxLength: 120 }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, maxLength: 120 }
            message: { type: string, maxLength: 1000 }
        result:
          anyOf:
            - { $ref: '#/components/schemas/EncodingDetectionResult' }
            - { $ref: '#/components/schemas/NormalizationResult' }
            - { $ref: '#/components/schemas/EncodingConversionResult' }
            - { $ref: '#/components/schemas/SyllabificationResult' }
            - { $ref: '#/components/schemas/OrthographyValidationResult' }
            - { $ref: '#/components/schemas/TransliterationResult' }
            - { $ref: '#/components/schemas/TokenizationResult' }
            - { $ref: '#/components/schemas/BatchSyllabifyResult' }
            - { $ref: '#/components/schemas/BatchTransliterateResult' }
    PlaygroundSave:
      type: object
      additionalProperties: false
      required: [id, title, snapshot]
      description:
        Complete request maximum 1 MiB. Client UUID permits identical retries.
        Limit 50 unexpired runs per user across projects; expiry 30 days from
        database creation time.
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        snapshot: { $ref: '#/components/schemas/PlaygroundRun' }
    PlaygroundRename:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
    PlaygroundRunMetadata:
      type: object
      additionalProperties: false
      required: [id, title, projectId, createdAt, expiresAt, payloadSize]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        projectId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        payloadSize: { type: integer, minimum: 1, maximum: 1048576 }
    PlaygroundSavedRun:
      type: object
      additionalProperties: false
      required:
        [id, title, projectId, createdAt, expiresAt, payloadSize, snapshot]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        projectId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        payloadSize: { type: integer, minimum: 1, maximum: 1048576 }
        snapshot: { $ref: '#/components/schemas/PlaygroundRun' }
    PlaygroundRunPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PlaygroundRunMetadata' }
        nextCursor: { type: [string, 'null'], format: uuid }
    PlaygroundDeleted:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted: { type: boolean, const: true }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          description: Deployed service version.
    TextRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          description:
            Text beyond 100,000 Unicode code points produces an item-level
            failure rather than failing the whole batch.
    ConvertTextRequest:
      type: object
      additionalProperties: false
      required: [text, from, to]
      properties:
        validateSource:
          type: boolean
          default: false
          examples: [true]
          description:
            Reject detected mixed, mismatched or uncertain sources before
            direction-changing conversion. Recommended for pasted text; not an
            automatic repair or correctness guarantee.
        text:
          type: string
          maxLength: 100000
        from:
          $ref: '#/components/schemas/ConversionEncoding'
        to:
          $ref: '#/components/schemas/ConversionEncoding'
    TransliterateTextRequest:
      type: object
      additionalProperties: false
      required: [text, scheme]
      properties:
        text:
          type: string
          maxLength: 100000
        scheme:
          type: string
          enum: [ala-lc-2011]
    ConversionEncoding:
      type: string
      enum: [unicode, zawgyi]
    EncodingSegment:
      type: object
      additionalProperties: false
