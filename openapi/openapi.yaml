  /platform/organizations/{organizationId}/usage-statements:
    parameters:
      - name: organizationId
        in: path
        required: true
        description: Tenant-scoped resource identifier.
        schema:
          type: string
          format: uuid
    get:
      operationId: getUsageStatement
      summary: Read a monthly billable usage statement (usage.read)
      tags: [Platform]
      security:
        - accountSession: []
      description: |
        Verified session required; API keys are not accepted. Non-members receive
        404 and members without usage.read receive 403.
        The billable unit is an admitted request: one counted once it passes
        authentication, permission and limit checks, even if it later fails
        validation. Each one is written to an append-only ledger in the same
        database transaction as the organization's quota counter, whether or not
        quota enforcement is enabled. A closed month returns its immutable stored
        statement; the current month, or a finished month not yet closed by the
        operator, is summed live (`status: open`). `reconciled` is false when the
        ledger differs from the quota counter, which is expected for the month
        metering was deployed. Counts are decimal strings.
      parameters:
        - name: month
          in: query
          description:
            UTC calendar month as YYYY-MM. Defaults to the current month.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Monthly statement.
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageStatement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
  /platform/organizations/{organizationId}/usage-statements/{month}/events.csv:
    parameters:
      - name: organizationId
        in: path
        required: true
        description: Tenant-scoped resource identifier.
        schema:
          type: string
          format: uuid
      - name: month
        in: path
        required: true
        description: UTC calendar month as YYYY-MM.
        schema:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    get:
      operationId: downloadUsageLedger
