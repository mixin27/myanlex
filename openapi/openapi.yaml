      tags: [Platform]
      security:
        - accountSession: []
      description: |
        Verified session required. Membership and current dynamic permissions
        are checked on every request. Writes require the configured trusted Origin.
      parameters:
        - name: after
          in: query
          description: Last key UUID from the previous page.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
