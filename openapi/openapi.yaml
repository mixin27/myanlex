        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
  /platform/organizations/{organizationId}/projects/{projectId}/usage:
    parameters:
      - name: organizationId
        in: path
        required: true
        description: Tenant-scoped resource identifier.
        schema:
          type: string
          format: uuid
      - name: projectId
        in: path
        required: true
        description: Tenant-scoped resource identifier.
        schema:
          type: string
          format: uuid
    get:
      operationId: getProjectUsage
      summary: Report recorded project usage (usage.read)
      tags: [Platform]
      security:
        - accountSession: []
      description: |
        Verified session and current membership/usage.read required; bearer keys
        are not accepted. Inclusive UTC date range, 1–90 days, no future dates,
        earliest 1970-01-01. Supply both dates or neither (last 30 days including
        today). Today's bucket is partial. Missing days are zero-filled.
        This is best-effort recorded usage, not a billing statement. Bootstrap
        traffic and rejections before the interceptor, including rate limits,
        are excluded. Persistence failures can leave gaps. Batch HTTP requests
        count once; item failures within successful responses are not HTTP errors.
        Submitted characters are Unicode code points, including failed requests
        that reached the interceptor. No submitted text is retained or returned.
        Counter strings preserve exact integer precision. Handler durations exclude
        network, guards and usage persistence. Totals match the returned buckets.
      parameters:
        - name: from
          in: query
          description:
            Inclusive start UTC calendar date; requires the other date.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Inclusive end UTC calendar date; requires the other date.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Recorded usage snapshot; private, no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      tags: [Health]
      security: []
      responses:
        '200':
          description: The service is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /text/detect:
    post:
      operationId: detectText
      summary: Detect Unicode or Zawgyi Myanmar text
      description:
        Non-Myanmar spans are preserved in the input but omitted from encoding
        segments.
      tags: [Text]
      requestBody:
        $ref: '#/components/requestBodies/TextRequest'
      responses:
        '200':
          description: Conservative encoding detection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncodingDetectionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
  /text/normalize:
    post:
      operationId: normalizeText
      summary: Apply safe Unicode normalization
      description:
        Applies NFC only and does not convert Zawgyi or repair spelling.
      tags: [Text]
      requestBody:
        $ref: '#/components/requestBodies/TextRequest'
      responses:
        '200':
          description: Unicode NFC normalization result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormalizationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
  /text/convert:
    post:
      operationId: convertText
      summary: Convert explicitly between Unicode and Zawgyi
      description:
        The source encoding must be supplied; this operation never auto-detects.
      tags: [Text]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertTextRequest'
      responses:
        '200':
          description: Explicit encoding conversion result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncodingConversionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
  /syllabify:
    post:
      operationId: syllabifyText
      summary: Segment Burmese orthographic syllables
      description: Returns written syllable units, not dictionary words.
      tags: [Burmese]
      requestBody:
        $ref: '#/components/requestBodies/TextRequest'
      responses:
        '200':
          description: Lossless Burmese orthographic segmentation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyllabificationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
  /orthography/validate:
    post:
      operationId: validateOrthography
      summary: Validate supported Burmese orthographic structure
      description:
        Structural validation does not claim dictionary spelling correctness.
      tags: [Burmese]
      requestBody:
        $ref: '#/components/requestBodies/TextRequest'
      responses:
        '200':
          description: Structural validation result with code-point spans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrthographyValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
  /transliterate:
    post:
      operationId: transliterateText
      summary: Transliterate Myanmar text to Latin
      description:
        Applies the selected published mapping and preserves unsupported input.
      tags: [Transliteration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransliterateTextRequest'
      responses:
