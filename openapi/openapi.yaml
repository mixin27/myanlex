            - orphan_mark
            - unsupported_myanmar
            - unsupported_stack_target
        severity:
          type: string
          const: error
        message:
          type: string
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    OrthographyValidationResult:
      type: object
      additionalProperties: false
      required: [input, valid, profile, diagnostics]
