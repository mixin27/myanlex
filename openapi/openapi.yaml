        schema:
          type: string
          format: uuid
    post:
      operationId: revokeApiKey
      summary: Irreversibly revoke a key (api_key.revoke)
      tags: [Platform]
      security:
        - accountSession: []
      description: |
        Verified session required. Membership and current dynamic permissions
        are checked on every request. Writes require the configured trusted Origin.
