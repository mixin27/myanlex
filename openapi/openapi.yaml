      security:
        - accountSession: []
      description: |
        Verified session required. Membership and current dynamic permissions
        are checked on every request. Writes require the configured trusted Origin.
        Members may always remove themselves. Removing others requires member.manage
        and every permission of the member being removed. Rejected with 409 when no
        member would keep member.manage and role.manage.
