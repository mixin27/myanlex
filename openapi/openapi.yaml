  /platform/organizations/{organizationId}/projects/{projectId}:
    get:
      operationId: getProject
      summary: Read a project (project.read)
      tags: [Platform]
      security:
        - accountSession: []
      description: |
        Verified session required. Membership and current dynamic permissions
