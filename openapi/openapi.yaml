      operationId: tokenizeText
      summary: Tokenize mixed Myanmar text
      description:
        Returns lexical/script units and does not claim dictionary word
        segmentation.
      tags: [Tokenization]
      requestBody:
        $ref: '#/components/requestBodies/TextRequest'
      responses:
        '200':
          description: Lossless tokens and scoped Myanmar/Latin script report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
  /batch/syllabify:
    post:
      operationId: batchSyllabify
      summary: Segment multiple texts into Burmese orthographic syllables
      description: |
        Processes items in request order. Invalid Unicode or overlong text
        fails only the affected item. Batch-wide limit violations fail the
        request.
      tags: [Batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSyllabifyRequest'
      responses:
        '200':
          description: Ordered syllabification results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSyllabifyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
  /batch/transliterate:
    post:
      operationId: batchTransliterate
      summary: Transliterate multiple Myanmar texts to Latin
      description: |
        Applies one explicit scheme to every item and preserves request order.
        Invalid Unicode or overlong text fails only the affected item.
      tags: [Batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTransliterateRequest'
      responses:
        '200':
          description: Ordered transliteration results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTransliterateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
components:
  securitySchemes:
    accountSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |
        Better Auth signed HttpOnly session cookie; HTTPS uses the
        __Secure-better-auth.session_token name. Sign in through /api/auth.
        Browser clients send cookies automatically; do not paste secrets into docs.
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: API-Key
      description: A MyanLex API key supplied as a bearer token.
  requestBodies:
    TextRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TextRequest'
  responses:
    WorkspaceNotFound:
      description: The resource does not exist or is not visible to this member.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceConflict:
      description: The slug is already in use.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PlatformUnavailable:
      description:
        Account authentication, persistence, or limit enforcement is
        unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request body, parameters, or Unicode text is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description:
        The required API key or account session is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description:
        Required permissions, email verification, or a trusted Origin are
        missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description:
        Text, item count, batch text, or the HTTP body exceeds its documented
        limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: |
        The caller exceeded its short-window allowance (rate_limited), or the
        organization exhausted a monthly allowance (quota_exceeded, persisted API
        keys only). Retry-After describes the applicable reset. RateLimit headers
        always describe the short window, not monthly quotas.
      headers:
        RateLimit-Limit:
          description: Maximum requests allowed in the current window.
          schema:
            type: integer
            minimum: 1
        RateLimit-Remaining:
          description: Requests remaining in the current window.
          schema:
            type: integer
            minimum: 0
        RateLimit-Reset:
          description: Seconds until the current window resets.
          schema:
            type: integer
            minimum: 1
        Retry-After:
          description: Seconds until another request should be attempted.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: An unexpected service error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    OrganizationInput:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Whitespace-trimmed display name, including Unicode.
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    ProjectInput:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          $ref: '#/components/schemas/OrganizationInput/properties/name'
        slug:
          $ref: '#/components/schemas/OrganizationInput/properties/slug'
        environment:
          type: string
          enum: [development, staging, production]
          default: development
    ProjectUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/OrganizationInput/properties/name'
        slug:
          $ref: '#/components/schemas/OrganizationInput/properties/slug'
        environment:
          type: string
          enum: [development, staging, production]
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    OrganizationAccess:
      type: object
      additionalProperties: false
      required: [id, name, slug, permissions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        permissions:
          type: array
          items:
            type: string
    Project:
      type: object
      additionalProperties: false
      required: [id, organizationId, name, slug, environment]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        environment:
          type: string
    OrganizationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        nextCursor:
          type: [string, 'null']
          format: uuid
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        nextCursor:
          type: [string, 'null']
          format: uuid
    ApiKeyInput:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [api.invoke]
          description:
            Only machine capabilities held by the creating member may be
            delegated.
        expiresAt:
          type: string
          format: date-time
          description: Future UTC expiration. Omit for no expiration.
    ApiKey:
      type: object
      additionalProperties: false
      required:
        [
          id,
          projectId,
          name,
          prefix,
          scopes,
          createdAt,
          lastUsedAt,
          expiresAt,
          revokedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
    CreatedApiKey:
      type: object
      additionalProperties: false
      required:
        [
          id,
          projectId,
          name,
          prefix,
          scopes,
          createdAt,
          lastUsedAt,
          expiresAt,
          revokedAt,
          secret,
        ]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        secret:
          type: string
          description:
            Returned once at creation. Never returned by list or revoke.
    ApiKeyPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
        nextCursor:
          type: [string, 'null']
          format: uuid
    UsageMetrics:
      type: object
      additionalProperties: false
      required:
        [
          requestCount,
          errorCount,
          charactersProcessed,
          processingTimeMs,
          averageProcessingTimeMs,
        ]
      properties:
        requestCount:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        errorCount:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        charactersProcessed:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        processingTimeMs:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        averageProcessingTimeMs:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
          description:
            Weighted handler duration, rounded to two decimals; null when no
            requests are recorded.
    UsageDay:
      type: object
      additionalProperties: false
      required:
        [
          date,
          requestCount,
          errorCount,
          charactersProcessed,
          processingTimeMs,
          averageProcessingTimeMs,
        ]
      properties:
        date:
          type: string
          format: date
        requestCount:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        errorCount:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        charactersProcessed:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        processingTimeMs:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        averageProcessingTimeMs:
          type: [string, 'null']
          pattern: '^[0-9]+\.[0-9]{2}$'
          description:
            Weighted handler duration, rounded to two decimals; null when no
            requests are recorded.
    UsageReport:
      type: object
      additionalProperties: false
      required:
        [projectId, from, to, timezone, generatedAt, metering, totals, days]
      properties:
        projectId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timezone:
          type: string
          const: UTC
        generatedAt:
          type: string
          format: date-time
        metering:
          type: string
          const: best-effort
        totals:
          $ref: '#/components/schemas/UsageMetrics'
        days:
          type: array
          minItems: 1
          maxItems: 90
          items:
            $ref: '#/components/schemas/UsageDay'
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          description: Deployed service version.
    TextRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          description:
            Text beyond 100,000 Unicode code points produces an item-level
            failure rather than failing the whole batch.
    ConvertTextRequest:
      type: object
      additionalProperties: false
      required: [text, from, to]
      properties:
        text:
          type: string
          maxLength: 100000
        from:
          $ref: '#/components/schemas/ConversionEncoding'
        to:
          $ref: '#/components/schemas/ConversionEncoding'
    TransliterateTextRequest:
      type: object
      additionalProperties: false
      required: [text, scheme]
      properties:
        text:
          type: string
          maxLength: 100000
        scheme:
          type: string
          enum: [ala-lc-2011]
    ConversionEncoding:
      type: string
      enum: [unicode, zawgyi]
    EncodingSegment:
      type: object
      additionalProperties: false
      required: [text, encoding, zawgyiProbability, start, end]
      properties:
        text:
          type: string
        encoding:
          type: string
          enum: [unicode, zawgyi, unknown]
        zawgyiProbability:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    EncodingDetectionResult:
      type: object
      additionalProperties: false
      required: [input, encoding, confidence, profile, segments]
      properties:
        input:
          type: string
        encoding:
          type: string
          enum: [unicode, zawgyi, mixed, unknown, non_myanmar]
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        profile:
          type: string
          const: zawgyi-unicode-v1
        segments:
          type: array
          items:
            $ref: '#/components/schemas/EncodingSegment'
    NormalizationResult:
      type: object
      additionalProperties: false
      required: [input, output, changed, profile]
      properties:
        input:
          type: string
        output:
          type: string
        changed:
          type: boolean
        profile:
          type: string
          const: unicode-nfc
    EncodingConversionResult:
      type: object
      additionalProperties: false
      required: [input, output, from, to, changed, profile]
      properties:
        input:
          type: string
        output:
          type: string
        from:
          $ref: '#/components/schemas/ConversionEncoding'
        to:
          $ref: '#/components/schemas/ConversionEncoding'
        changed:
          type: boolean
        profile:
          type: string
          const: cldr-zawgyi-v1
    BurmeseSyllableSegment:
      type: object
      additionalProperties: false
      required: [kind, text, start, end]
      properties:
        kind:
          type: string
          enum: [burmese_syllable, separator, non_myanmar, unsupported_myanmar]
        text:
          type: string
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    SyllabificationResult:
      type: object
      additionalProperties: false
      required: [input, profile, segments]
      properties:
        input:
          type: string
        profile:
          type: string
          const: burmese-orthographic-v1
        segments:
          type: array
          items:
            $ref: '#/components/schemas/BurmeseSyllableSegment'
    OrthographyDiagnostic:
      type: object
      additionalProperties: false
      required: [code, severity, message, start, end]
      properties:
        code:
          type: string
          enum:
            - component_order
            - dangling_virama
            - duplicate_component
            - invalid_syllable_start
            - orphan_mark
            - unsupported_myanmar
            - unsupported_stack_target
        severity:
          type: string
          const: error
        message:
          type: string
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    OrthographyValidationResult:
      type: object
      additionalProperties: false
      required: [input, valid, profile, diagnostics]
      properties:
        input:
          type: string
        valid:
          type: boolean
        profile:
          type: string
          const: burmese-orthography-v1
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/OrthographyDiagnostic'
    TransliterationSegment:
      type: object
      additionalProperties: false
      required: [kind, input, output, start, end]
      properties:
        kind:
          type: string
          enum: [transliterated, preserved, unsupported]
        input:
          type: string
        output:
          type: string
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    TransliterationResult:
      type: object
      additionalProperties: false
      required: [input, output, scheme, profile, complete, segments]
      properties:
        input:
          type: string
        output:
          type: string
        scheme:
          type: string
          enum: [ala-lc-2011]
        profile:
          type: string
          const: ala-lc-2011-mapping-v1
        complete:
          type: boolean
        segments:
          type: array
          items:
            $ref: '#/components/schemas/TransliterationSegment'
    TextToken:
      type: object
      additionalProperties: false
      required: [kind, text, script, start, end]
      properties:
        kind:
          type: string
          enum:
            - burmese_syllable
            - latin_word
            - number
            - punctuation
            - whitespace
            - emoji
            - unsupported_myanmar
            - other
        text:
          type: string
        script:
          type: string
          enum: [myanmar, latin, common, unknown]
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    TokenizationResult:
      type: object
      additionalProperties: false
      required: [input, profile, tokens, scripts, mixedScript]
      properties:
        input:
          type: string
        profile:
          type: string
          const: myanmar-script-tokens-v1
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TextToken'
        scripts:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            type: string
            enum: [myanmar, latin]
        mixedScript:
          type: boolean
    BatchItem:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        text:
          type: string
          maxLength: 100000
          description: Well-formed Unicode text, limited by Unicode code points.
    BatchSyllabifyRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/BatchItem'
          description: Combined item text is limited to 1,000,000 UTF-8 bytes.
    BatchTransliterateRequest:
      type: object
      additionalProperties: false
      required: [items, scheme]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/BatchItem'
          description: Combined item text is limited to 1,000,000 UTF-8 bytes.
        scheme:
          type: string
          enum: [ala-lc-2011]
    BatchItemError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_unicode, text_too_long]
        message:
          type: string
    BatchItemFailure:
      type: object
      additionalProperties: false
      required: [id, success, error]
      properties:
        id:
          type: string
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/BatchItemError'
    BatchSyllabifySuccess:
      type: object
      additionalProperties: false
      required: [id, success, result]
      properties:
        id:
          type: string
        success:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/SyllabificationResult'
    BatchTransliterateSuccess:
      type: object
      additionalProperties: false
      required: [id, success, result]
      properties:
        id:
          type: string
        success:
          type: boolean
          const: true
        result:
          $ref: '#/components/schemas/TransliterationResult'
    BatchSyllabifyResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/BatchSyllabifySuccess'
              - $ref: '#/components/schemas/BatchItemFailure'
    BatchTransliterateResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/BatchTransliterateSuccess'
              - $ref: '#/components/schemas/BatchItemFailure'
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            - invalid_request
            - invalid_unicode
            - text_too_long
            - batch_empty
            - batch_too_large
            - batch_too_many_items
            - payload_too_large
            - unauthorized
            - forbidden
            - not_found
            - rate_limited
            - quota_exceeded
            - service_unavailable
            - conflict
            - internal_error
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
