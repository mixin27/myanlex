        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PlatformUnavailable'
  /platform/organizations/{organizationId}/projects/{projectId}/api-keys/{keyId}/revoke:
    parameters:
      - name: organizationId
        in: path
        required: true
        description: Tenant-scoped resource identifier.
        schema:
          type: string
          format: uuid
      - name: projectId
        in: path
        required: true
        description: Tenant-scoped resource identifier.
        schema:
