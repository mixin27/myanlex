# MyanLex production stack for one VPS, deployed as a Dokploy "Compose" app
# from this repository (compose path: ./infra/compose.production.yaml).
# Runbook: docs/dokploy-runbook.md. Decision: docs/decisions/0027.
#
# - Images come from GHCR, built by .github/workflows/deploy.yml. IMAGE_TAG
#   picks the release: "production" / "staging" (moved by the workflow) or
#   "<env>-sha-<7>" to pin or roll back. There is no "latest".
# - Every variable is listed in infra/.env.production.example. Set them in
#   Dokploy -> Environment; never commit real values.
# - Domains are added in Dokploy -> Domains (web -> 3000, api -> 3001,
#   docs -> 3002); Dokploy adds the Traefik labels and certificates. Nothing
#   here publishes a port on the host.
# - Staging on the same VPS: a second Dokploy app with STACK_NAME=staging.
name: myanlex-${STACK_NAME:-production}

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-hardening: &hardening
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging

x-api-env: &api-env
  NODE_ENV: production
  MYANLEX_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  REDIS_URL: redis://redis:6379
  MYANLEX_REDIS_PREFIX: myanlex-${STACK_NAME:-production}
  MYANLEX_QUOTAS_ENABLED: 'true'
  MYANLEX_TRUST_PROXY: ${MYANLEX_TRUST_PROXY:-false}
  MYANLEX_METRICS_TOKEN: ${MYANLEX_METRICS_TOKEN:?}
  MYANLEX_RATE_LIMIT_MAX: ${MYANLEX_RATE_LIMIT_MAX:-60}
  AUTH_ENABLED: 'true'
  AUTH_SECRET: ${AUTH_SECRET:?}
  AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:?}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:?}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_SECURE: ${SMTP_SECURE:-true}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:?}
  MYANLEX_BILLING_PAYMENT_INSTRUCTIONS: ${MYANLEX_BILLING_PAYMENT_INSTRUCTIONS:?}
  MYANLEX_BILLING_NOTIFY_EMAIL: ${MYANLEX_BILLING_NOTIFY_EMAIL:-}
  MYANLEX_USAGE_RETENTION_MONTHS: ${MYANLEX_USAGE_RETENTION_MONTHS:-13}
  MYANLEX_AUDIT_RETENTION_DAYS: ${MYANLEX_AUDIT_RETENTION_DAYS:-365}

x-ops-image:
  &ops-image ghcr.io/${GHCR_OWNER:?}/myanlex-ops:${IMAGE_TAG:?set IMAGE_TAG,
  e.g. production}

services:
  # One-off per deploy: refuse a bad configuration, then apply migrations.
  # api starts only after it exits successfully, so a failed deploy leaves
  # the previous version serving.
  migrate:
    <<: *hardening
    image: *ops-image
    pull_policy: always
    command: ['sh', '-c', 'pnpm --silent config:check && pnpm db:deploy']
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    read_only: true
    tmpfs: ['/tmp']

  api:
    <<: *hardening
    image: ghcr.io/${GHCR_OWNER:?}/myanlex-api:${IMAGE_TAG:?}
    pull_policy: always
    environment:
      <<: *api-env
      PORT: 3001
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: ['/tmp']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/v1/health/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 768M }

  web:
    <<: *hardening
    image: ghcr.io/${GHCR_OWNER:?}/myanlex-web:${IMAGE_TAG:?}
    pull_policy: always
    environment:
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: ['/tmp', '/app/apps/web/.next/cache']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 512M }

  docs:
    <<: *hardening
    image: ghcr.io/${GHCR_OWNER:?}/myanlex-docs:${IMAGE_TAG:?}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp', '/app/apps/docs/.next/cache']
    deploy:
      resources:
        limits: { memory: 384M }

  # Daily jobs at 00:30 UTC (infra/crontab): backup, close-month,
  # issue-monthly, dunning and cleanups, with a heartbeat ping.
  jobs:
    <<: *hardening
    image: *ops-image
    pull_policy: always
    environment:
      <<: *api-env
      MYANLEX_HEARTBEAT_URL: ${MYANLEX_HEARTBEAT_URL:-}
      MYANLEX_USAGE_ALERTS_HEARTBEAT_URL: ${MYANLEX_USAGE_ALERTS_HEARTBEAT_URL:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-postgres}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp']
    deploy:
      resources:
        limits: { memory: 512M }

  postgres:
    <<: *hardening
    image: postgres:18.6-alpine
    # The official entrypoint drops from root to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes: [pgdata:/var/lib/postgresql]
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256m
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1G }

  redis:
    <<: *hardening
    image: redis:8.10.1-alpine
    cap_add: [SETGID, SETUID]
    # Rate-limit and quota counters: never evict them silently under memory
    # pressure. Append-only so limits survive a restart.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: [redisdata:/data]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 192M }

volumes:
  pgdata:
  redisdata:
