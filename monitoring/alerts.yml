groups:
  - name: myanlex
    rules:
      - alert: MyanLexMetricsUnavailable
        expr: up{job="myanlex-api"} == 0 or absent(up{job="myanlex-api"})
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: API metrics cannot be scraped
      - alert: MyanLexNotReady
        expr:
          probe_success{job="myanlex-readiness"} == 0 or
          up{job="myanlex-readiness"} == 0 or
          absent(up{job="myanlex-readiness"})
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: API readiness probe is failing or unavailable
      - alert: MyanLexHighServerErrors
        expr: |
          (sum by (job) (rate(myanlex_http_requests_total{job="myanlex-api",status_code=~"5.."}[5m]))
          / sum by (job) (rate(myanlex_http_requests_total{job="myanlex-api"}[5m])) > 0.05)
          and (sum by (job) (rate(myanlex_http_requests_total{job="myanlex-api"}[5m])) > 1)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: API server errors exceed five percent at sustained traffic
      - alert: MyanLexHighLatency
        expr: |
          (histogram_quantile(0.95, sum by (job, le) (rate(myanlex_http_request_duration_seconds_bucket{job="myanlex-api"}[5m]))) > 1)
          and (sum by (job) (rate(myanlex_http_request_duration_seconds_count{job="myanlex-api"}[5m])) > 1)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: API p95 latency exceeds one second at sustained traffic
