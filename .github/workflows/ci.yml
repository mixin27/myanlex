name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: myanlex
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: myanlex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      MYANLEX_TEST_REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://myanlex:test-only@localhost:5432/myanlex_test
      MYANLEX_TEST_DATABASE_URL: postgresql://myanlex:test-only@localhost:5432/myanlex_test
      AUTH_ENABLED: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:deploy
      - name: Seed baseline permissions and Free plan
        run: pnpm db:seed
      - name: Run checks (including account persistence)
        run: pnpm check
