name: Package compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: '22.22.3', browser: chromium }
          - { node: '24.21.0', browser: chromium }
          - { node: '24.21.0', browser: firefox }
          - { node: '24.21.0', browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm packages:test
      - name: Verify packed packages outside the workspace
        run: pnpm packages:verify
        env:
          MYANLEX_TEST_BROWSER: ${{ matrix.browser }}
      - name: Retain development package evidence (not a registry release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-evidence-${{ matrix.node }}-${{ matrix.browser }}
          path: .cache/package-release/run-*/artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
