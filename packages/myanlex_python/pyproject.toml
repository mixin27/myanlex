[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "myanlex-python"
version = "0.0.0"
description = "Typed synchronous and asynchronous clients for the MyanLex API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.28.1,<0.29", "pydantic>=2.13.5,<3"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
dev = ["build>=1,<2", "ruff>=0.15,<1", "mypy>=1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/myanlex"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
